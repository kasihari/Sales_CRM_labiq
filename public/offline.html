<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab IQ Sales — Offline</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0d9488;
        color: #fff;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        text-align: center;
        padding: 24px;
      }
      .box { max-width: 320px; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { opacity: 0.9; }
      button {
        margin-top: 20px;
        background: #fff;
        color: #0f766e;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 700;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div style="font-size: 3rem">📴</div>
      <h1>You&apos;re offline</h1>
      <p>
        Some pages need a connection. Any visits you recorded are saved on this
        device and will sync automatically when you&apos;re back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
